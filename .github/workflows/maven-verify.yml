name: Maven Verify

on:
  workflow_call:
    inputs:
      pre-build-script:
        description: 'Shell script to run before the build (e.g. install system packages)'
        required: false
        default: ''
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(release):') }}

    permissions: write-all

    steps:
      - uses: actions/checkout@v6

      - name: Pre-build setup
        if: inputs.pre-build-script != ''
        shell: bash
        run: ${{ inputs.pre-build-script }}

      - name: Get Java-Version from pom.xml
        id: get-java-version
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          local = lambda e: e.tag.rsplit("}", 1)[-1]
          root = ET.parse("pom.xml").getroot()
          info = [(e.text or "").strip() for e in root.iter() if local(e) == "maven.compiler.release"]
          if not info:
              raise SystemExit("maven.compiler.release not found in pom.xml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"info={','.join(info)}\n")

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.get-java-version.outputs.info }}
          distribution: "temurin"
          cache: "maven"

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        if: github.event_name == 'pull_request'
        with:
          languages: java

      - name: Build and verify with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        if: github.event_name == 'pull_request'

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/composite@v1
        if: always()
        with:
          files: "target/surefire-reports/**/*.xml"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: jwgmeligmeyling/pmd-github-action@master
        if: always()
        with:
          path: "target/pmd.xml"

      - uses: jwgmeligmeyling/checkstyle-github-action@master
        if: always()
        with:
          path: "target/checkstyle-result.xml"

      - uses: jwgmeligmeyling/spotbugs-github-action@master
        if: always()
        with:
          path: "target/spotbugsXml.xml"
