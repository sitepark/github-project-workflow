name: PNPM Verify

on:
  workflow_call:
    inputs:
      nodeVersion:
        default: "24"
        type: string
      pre-build-script:
        description: 'Shell script to run before the build (e.g. install system packages)'
        required: false
        default: ''
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v6

      - name: Pre-build setup
        if: inputs.pre-build-script != ''
        shell: bash
        run: ${{ inputs.pre-build-script }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.nodeVersion }}
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Verify
        run: |
          pnpm install
          pnpm test
          pnpm verify

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/composite@v1
        if: always()
        with:
          files: "build/junit-report*.xml"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/cobertura-coverage.xml
          verbose: true
