name: Maven Deploy Snapshot

on:
  workflow_call:
    inputs:
      pre-build-script:
        description: 'Shell script to run before the build (e.g. install system packages)'
        required: false
        default: ''
        type: string
    secrets:
      MVN_REPO_SNAPSHOT_SERVER_ID:
        required: true
      MVN_REPO_SNAPSHOT_SERVER_USERNAME:
        required: true
      MVN_REPO_SNAPSHOT_SERVER_PASSWORD:
        required: true
      MVN_REPO_SNAPSHOT_SERVER_URL:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(release):') }}

    steps:
      - uses: actions/checkout@v6

      - name: Pre-build setup
        if: inputs.pre-build-script != ''
        shell: bash
        run: ${{ inputs.pre-build-script }}

      - name: Get project-version from pom.xml
        id: get-project-version
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          local = lambda e: e.tag.rsplit("}", 1)[-1]
          root = ET.parse("pom.xml").getroot()
          info = [(e.text or "").strip() for e in root if local(e) == "version"]
          if not info:
              raise SystemExit("project version not found in pom.xml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"info={','.join(info)}\n")

      - name: Check if snapshot
        if: ${{ endsWith(steps.get-project-version.outputs.info, '-SNAPSHOT') == false }}
        run: |
          echo "Not a snapshot-version: ${{ steps.get-project-version.outputs.info }}"
          exit 1

      - name: Get java-version from pom.xml
        id: get-java-version
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          local = lambda e: e.tag.rsplit("}", 1)[-1]
          root = ET.parse("pom.xml").getroot()
          info = [(e.text or "").strip() for e in root.iter() if local(e) == "maven.compiler.release"]
          if not info:
              raise SystemExit("maven.compiler.release not found in pom.xml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"info={','.join(info)}\n")

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.get-java-version.outputs.info }}
          distribution: "temurin"
          cache: "maven"
          server-id: ${{ secrets.MVN_REPO_SNAPSHOT_SERVER_ID }}
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build and deploy with Maven
        run: mvn -DaltDeploymentRepository=${{ secrets.MVN_REPO_SNAPSHOT_SERVER_ID }}::${{ secrets.MVN_REPO_SNAPSHOT_SERVER_URL }} --batch-mode --update-snapshots deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MVN_REPO_SNAPSHOT_SERVER_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MVN_REPO_SNAPSHOT_SERVER_PASSWORD }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
